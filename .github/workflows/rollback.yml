name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: Cloudflare version UUID (blank = previous version)
        type: string
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    uses: gingur/devkit/.github/workflows/cf.worker.rollback.yml@main
    with:
      runner: ${{ vars.RUNNER }}
      version: ${{ inputs.version }}
      infisicalProject: gingur
      infisicalEnv: public
      infisicalPath: /troyrhinehart/cloudflare
      infisicalIdentity: 3556886a-b83e-496d-9072-848a3d408f34 # gh-cf-deploy
    secrets: inherit
