name: Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write # required for GitHub OIDC
  pull-requests: write # remove sticky preview comment

jobs:
  cleanup:
    uses: gingur/devkit/.github/workflows/cf.worker.preview.cleanup.yml@main
    with:
      app: troyrhinehart
      domain: troyrhinehart.com
      cfZone: 237ce07141f91c1ef4e427be200e1936 # troyrhinehart.com
      infisicalProject: gingur
      infisicalEnv: preview
      infisicalPath: /troyrhinehart/cloudflare
      infisicalIdentity: 3556886a-b83e-496d-9072-848a3d408f34 # gh-cf-deploy
    secrets: inherit
