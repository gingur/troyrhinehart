[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spinquest_sim"
version = "0.1.0"
description = "Offline casino simulation stack"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]
report = ["matplotlib"]
mcp = ["mcp"]

[tool.setuptools.packages.find]
include = ["spinquest_sim*", "mcp_server*"]
